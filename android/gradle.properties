org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP refuses non-ASCII project paths, and this repo lives under "Yeni klasör (2)".
# Verified working; if aapt2 or the NDK ever start failing with path errors,
# moving the repo to an ASCII directory is the real fix rather than this flag.
android.overridePathCheck=true

# NOTE: this machine cannot connect to AF_UNIX socket files inside
# %LOCALAPPDATA%\Temp, and the JDK backs every Selector/Pipe with one, so no
# Gradle daemon starts ("Unable to establish loopback connection"). The fix is
# -Djdk.net.unixdomain.tmpdir pointing somewhere else, but it must be set through
# JAVA_TOOL_OPTIONS, not here: Gradle pulls -D flags out of jvmargs and applies
# them via System.setProperty after the daemon is already running, which is too
# late for a value read in a static initialiser. tools/build-android.ps1 sets it.
